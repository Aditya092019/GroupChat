<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="login.css">

    <title>Login</title>
</head>

<body>

    <div class="login-container">
        <form id="loginform">

            <label for="email">
                Email Address

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </label>

            <label for="password">
                Password

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </label>
            <button type="submit" id="submitted">
                Sign In
            </button>

        </form>

        <p id="message"></p>

        <p id="signup">
            Don't have an account?
            <a href="../signup/signup.html">Sign Up</a>
        </p>

    </div>

    <script src="login.js"></script>

</body>
</html>
